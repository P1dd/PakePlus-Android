
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金阙·万亿人生 4.0</title>
<style>
*{box-sizing:border-box}
:root{--gold:#dfbd76;--gold2:#a77b39;--bg:#100d0a;--panel:#211a13;--line:#594329;--muted:#a9987c;--green:#75c995;--red:#e47d78}
body{margin:0;background:radial-gradient(ellipse at top,#302116,#100d0a 65%);color:#eee2c6;font-family:"Microsoft YaHei",sans-serif}
button{background:linear-gradient(135deg,#705027,#342415);border:1px solid #a37c43;color:#f7dfaa;padding:9px 13px;border-radius:5px;cursor:pointer;font-size:12px}
button:hover{filter:brightness(1.25)}
button:disabled{opacity:.35;cursor:not-allowed}
input,select{background:#110e0a;border:1px solid var(--line);color:#eee2c6;padding:9px;border-radius:5px;max-width:100%}
header{padding:18px 4%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#17120d;gap:10px}
.logo{font:29px Georgia;letter-spacing:8px;color:var(--gold)}
.small{font-size:11px;color:#947c56;letter-spacing:2px}
main{max-width:1500px;margin:auto;padding:22px 3%}
.hero{height:230px;border:1px solid var(--line);border-radius:8px;position:relative;background:linear-gradient(90deg,#100d0bf2,#100d0b55),url("https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=1600") center/cover}
.heroText{position:absolute;left:5%;top:17%}
.hero h1{font:40px Georgia,"Microsoft YaHei";color:var(--gold);letter-spacing:4px}
.hero p{color:#c3b394;line-height:1.9}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:15px 0}
.stat,.panel{background:linear-gradient(140deg,#2b2117,#18130f);border:1px solid var(--line);border-radius:7px;padding:15px}
.stat span{font-size:11px;color:var(--muted)}
.stat strong{display:block;font:22px Georgia;color:var(--gold);margin-top:8px;overflow-wrap:anywhere}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}
.tabs button.active{background:#9a7136;color:#fff}
.layout{display:grid;grid-template-columns:1.7fr .8fr;gap:14px}
h2{font:20px Georgia,"Microsoft YaHei";font-weight:normal;color:var(--gold);margin-top:0}
h3{font-size:15px;font-weight:normal;color:#f0d9a7;margin:4px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.item{display:flex;gap:12px;background:#17130f;border:1px solid #4c3923;padding:13px;border-radius:6px;min-width:0}
.item>div:last-child{min-width:0}
.icon{font-size:29px;width:40px;flex-shrink:0}
.item p{font-size:12px;color:var(--muted);line-height:1.7;margin:6px 0}
.price{color:var(--gold);font-size:12px;line-height:1.8;margin:8px 0}
.item button{font-size:11px;padding:7px 9px;margin:2px}
.side{display:grid;gap:12px;align-content:start}
.person{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid #483721}
.face{font-size:27px}
.person small{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.bar{height:5px;background:#080706;margin-top:6px;border-radius:5px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:5px}
.log{font-size:12px;color:#bba98b;line-height:2;max-height:280px;overflow:auto}
.note{font-size:12px;line-height:1.9;color:#c4b18d}
.event{border:1px solid #76552c;padding:15px;border-radius:6px;margin-bottom:12px;background:#20170f}
.event p{font-size:12px;line-height:1.8;color:#c4b18d}
.modal{display:none;position:fixed;inset:0;background:#000c;z-index:20;place-items:center;padding:15px}
.modal.show{display:grid}
.modalbox{width:min(550px,100%);max-height:85vh;overflow:auto;background:#211910;border:1px solid var(--gold2);padding:22px;border-radius:9px}
.modalbox h2{margin-top:0}
.modalbox p{font-size:13px;line-height:1.9;color:#c8b99e;white-space:pre-line}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.positive{color:var(--green)!important}
.negative{color:var(--red)!important}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:9px 5px;border-bottom:1px solid #483721;text-align:left}
th{color:var(--gold);font-weight:normal}
@media(max-width:900px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero h1{font-size:27px}.hero{height:200px}}

/* 皇家赌场沉浸式牌桌 */
.casino-shell{grid-column:1/-1;background:radial-gradient(ellipse at 50% 0%,#4b351b 0,#1c160f 58%,#100d0a 100%);border:1px solid #9a733b;border-radius:10px;padding:20px;box-shadow:inset 0 0 45px #0008}
.casino-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #76552c;padding-bottom:14px;margin-bottom:16px}
.casino-brand{font:26px Georgia,serif;color:#e8c77f;letter-spacing:4px}
.casino-wallet{display:flex;gap:10px;flex-wrap:wrap}.casino-wallet span{background:#100d0a;border:1px solid #73552d;padding:8px 12px;border-radius:5px;color:#d9bd83;font-size:12px}
.casino-lobby{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.casino-table-card{min-height:180px;border:1px solid #78592f;border-radius:8px;padding:18px;background:linear-gradient(145deg,#302316,#17120d);display:flex;flex-direction:column;justify-content:space-between;transition:.2s}
.casino-table-card:hover{transform:translateY(-3px);border-color:#e0bd77;box-shadow:0 8px 24px #0008}
.casino-table-card .emoji{font-size:36px}.casino-table-card p{font-size:12px;color:#bba783;line-height:1.8}
.casino-room{border:1px solid #8b6938;border-radius:9px;padding:18px;background:radial-gradient(ellipse at center,#28513d,#10271d 70%);box-shadow:inset 0 0 35px #0009}
.casino-felt{border:5px double #b18a4e;border-radius:48% / 18%;min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px;background:radial-gradient(ellipse,#176342,#0b3827 70%);box-shadow:0 10px 25px #0008,inset 0 0 35px #0008}
.casino-felt .big-result{font:48px Georgia;color:#f3d78f;text-shadow:0 2px 8px #000}.casino-felt .sub-result{color:#f1dfb7;font-size:13px;line-height:1.9}
.casino-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}
.casino-control{background:#17120d;border:1px solid #70532d;border-radius:7px;padding:14px}.casino-control label{display:block;font-size:12px;color:#c8ad78;margin-bottom:7px}
.casino-control input,.casino-control select{width:100%;max-width:none;margin-bottom:10px}
.chip-row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.chip{width:42px;height:42px;border-radius:50%;padding:0;background:radial-gradient(circle,#d7bd82 0 48%,#6f4b1e 50% 62%,#d7bd82 64%);color:#24180b;font-size:10px;font-weight:bold;border:2px dashed #f0d99e}
.casino-last{grid-column:1/-1;background:#17120d;border:1px solid #70532d;border-radius:7px;padding:14px;color:#d7c49d;font-size:13px;line-height:1.9}
.casino-back{margin-bottom:12px}
@media(max-width:700px){.casino-lobby,.casino-controls{grid-template-columns:1fr}.casino-felt{min-height:190px}.casino-brand{font-size:20px}}

</style>
</head>
<body>
<header>
 <div>
  <div class="logo">金 阙</div>
  <div class="small">THE GOLDEN EMPIRE · VERSION 4.0</div>
 </div>
 <div style="text-align:right">
  <div>第 <b id="day">1</b> 日</div>

 </div>
</header>

<main>
 <section class="hero">
  <div class="heroText">
   <div class="small">财富 · 权势 · 欲望 · 奢华</div>
   <h1>醒掌天下财，醉卧金阙中</h1>
   <p>你所拥有的不仅是财富，而是一个由你定义的世界。<br>让整个时代，记住你的名字。</p>
  </div>
 </section>

 <div class="stats">
  <div class="stat"><span>现金储备</span><strong id="cash">10亿</strong></div>
  <div class="stat"><span>总资产</span><strong id="assets">10亿</strong></div>
  <div class="stat"><span>每日净收益</span><strong id="profit">0</strong></div>
  <div class="stat"><span>社会名望</span><strong id="fame">0</strong></div>
  <div class="stat"><span>财富等级</span><strong id="rank">亿万富豪</strong></div>
 </div>

 <nav class="tabs" id="tabs">
  <button class="active" data-tab="estate" onclick="show('estate',this)">府邸</button>
  <button data-tab="luxury" onclick="show('luxury',this)">奢华生活</button>
  <button data-tab="people" onclick="show('people',this)">伴侣与社交</button>
  <button data-tab="night" onclick="show('night',this)">夜色金阙</button>
  <button data-tab="business" onclick="show('business',this)">商业帝国</button>
  <button data-tab="treasure" onclick="show('treasure',this)">珍宝收藏</button>
  <button data-tab="stocks" onclick="show('stocks',this)">证券交易所</button>
  <button data-tab="invest" onclick="show('invest',this)">商业投资</button>
  <button data-tab="rank" onclick="show('rank',this)">世界富豪榜</button>
  <button data-tab="casino" onclick="show('casino',this)">皇家赌场</button>
 </nav>

 <div class="layout">
  <section class="panel">
   <h2 id="heading">皇家府邸</h2>
   <div id="content" class="grid"></div>
  </section>
  <aside class="side">
   <section class="panel">
    <h2>私人生活</h2>
    <div id="peopleMini" class="note"></div>
   </section>
   <section class="panel">
    <h2>今日行程</h2>
    <div id="brief" class="note">今日暂无特殊安排。</div>
    <br><button onclick="nextDay()">结束今日 →</button>
   </section>
   <section class="panel">
    <h2>人生纪事</h2>
    <div id="logs" class="log"></div>
   </section>
   <section class="panel">
    <h2>人生管理</h2>
    <div class="actions"><button onclick="resetGame()">重开人生</button></div>
    <p class="note">本局进度仅保留在当前页面内存中。刷新或关闭页面后将重新开始。</p>
   </section>
  </aside>
 </div>
</main>

<footer style="text-align:center;padding:25px;color:#695638;font-size:11px">
 金阙 4.0 · 无存档模式 · 虚构人生经营模拟器 · 所有角色均为成年虚构人物
</footer>

<div class="modal" id="modal">
 <div class="modalbox">
  <h2 id="mt"></h2>
  <p id="mb"></p>
  <div class="actions" id="ma"></div>
 </div>
</div>

<script>
"use strict";

/* =========================
   1. 基础数据与存档
========================= */
const base={
 day:1,cash:1000000000,assets:0,fame:0,income:0,expense:0,
 owned:[],business:[],women:[],logs:[],
 stockQuotes:{},stockHoldings:{},
 investments:[],marketRegime:"震荡市",marketDaysLeft:5,
 hotSector:"人工智能",marketNews:"市场暂时没有重大消息。",
 investigations:{},investigationAmounts:{},
 charm:10,events:0,clubs:[]
};

function clone(obj){return JSON.parse(JSON.stringify(obj))}
function number(v,def=0){return Number.isFinite(Number(v))?Number(v):def}

function normalize(data){
 let g={...clone(base),...(data||{})};
 g.owned=Array.isArray(g.owned)?g.owned:[];
 g.logs=Array.isArray(g.logs)?g.logs:[];
 g.women=Array.isArray(g.women)?g.women:[];
 g.investments=Array.isArray(g.investments)?g.investments:[];
 g.stockQuotes=g.stockQuotes||{};
 g.stockHoldings=g.stockHoldings||{};
 g.investigations=g.investigations||{};
 g.investigationAmounts=g.investigationAmounts||{};
 g.cash=number(g.cash,base.cash);
 g.assets=number(g.assets);
 g.income=number(g.income);
 g.expense=number(g.expense);
 g.fame=number(g.fame);
 g.day=Math.max(1,Math.floor(number(g.day,1)));
 g.women=g.women.map(w=>({
  ...w,
  affinity:number(w.affinity,24),
  intimacy:number(w.intimacy),
  trust:number(w.trust,20),
  jealousy:number(w.jealousy)
 }));
 return g;
}

let g=clone(base);

let current="estate";
let casinoTable="lobby";
let casinoBetAmount=100000;
let casinoExchangeAmount=1000000;
let casinoLastResult=null;

/* =========================
   2. 通用工具
========================= */
const fmt=n=>{
 n=number(n);
 let abs=Math.abs(n);
 let out=abs>=1e12?(abs/1e12).toFixed(2)+"万亿":
         abs>=1e8?(abs/1e8).toFixed(2)+"亿":
         abs>=1e4?(abs/1e4).toFixed(1)+"万":
         Math.round(abs).toLocaleString("zh-CN");
 return (n<0?"-":"")+out;
};

const pct=n=>(number(n)*100).toFixed(2)+"%";

function record(text){
 g.logs.unshift("第"+g.day+"日："+text);
 g.logs=g.logs.slice(0,100);
}

function rankName(){
 let total=g.cash+g.assets+stockValue()+investmentValue();
 const levels=[
  [0,"亿万富豪"],
  [2000000000,"超级富豪"],
  [10000000000,"商业巨擘"],
  [50000000000,"豪门领袖"],
  [100000000000,"世界富豪"],
  [500000000000,"全球顶级财团"],
  [1000000000000,"万亿帝王"],
  [5000000000000,"世界首富候选"],
  [10000000000000,"财富传奇"],
  [50000000000000,"金融之神"]
 ];
 let result=levels[0][1];
 levels.forEach(x=>{if(total>=x[0])result=x[1]});
 return result;
}

function totalWorth(){
 return g.cash+g.assets+stockValue()+investmentValue();
}

function modal(title,text,buttons){
 document.getElementById("mt").textContent=title;
 document.getElementById("mb").textContent=text;
 let area=document.getElementById("ma");
 area.innerHTML="";
 (buttons||[["知道了",closeModal]]).forEach(item=>{
  let b=document.createElement("button");
  b.textContent=item[0];
  b.onclick=item[1];
  area.appendChild(b);
 });
 document.getElementById("modal").classList.add("show");
}

function closeModal(){
 document.getElementById("modal").classList.remove("show");
}

function askNumber(title,defaultValue){
 let v=prompt(title,defaultValue===undefined?"":String(defaultValue));
 if(v===null)return null;
 // 兼容用户输入 1,000,000、￥1000000 等常见格式
 let cleaned=String(v).trim().replace(/[，,\s￥¥元]/g,"");
 if(cleaned==="")return null;
 let n=Number(cleaned);
 return Number.isFinite(n)?n:null;
}

/* =========================
   3. 资产目录
========================= */
const catalog={
 estate:[
  ["云顶皇家庄园","🏛️","私人泳池、宴会厅、花园与皇家主卧。",180000000,180000,120],
  ["天际云端宫邸","🏙️","城市顶层复式宫殿。",85000000,85000,65],
  ["蓝湾私人岛屿","🏝️","整座私人海岛与专属码头。",320000000,260000,220],
  ["欧洲皇家古堡","🏰","百年古堡、酒窖、马场与玫瑰园。",260000000,210000,190],
  ["私人宫殿扩建","👑","将现有主宅升级为超大型私人宫殿。",150000000,120000,180]
 ],
 luxury:[
  ["湾流私人飞机","🛩️","私人洲际飞行。",150000000,350000,130],
  ["曜金号超级游艇","🛥️","泳池、影院与派对甲板。",220000000,420000,180],
  ["典藏超跑车库","🏎️","全球限量跑车收藏。",65000000,95000,75],
  ["私人管家团队","🎩","管家、厨师、司机与礼宾服务。",12000000,30000,35],
  ["鎏金私人会所","🥂","只接待受邀的贵宾与名流。",35000000,90000,80]
 ],
 business:[
  ["星瀚科技集团","💻","人工智能与高端制造。",120000000,1800000,110],
  ["远洋国际资本","📈","全球投资和资产管理。",200000000,3200000,160],
  ["瑰丽酒店集团","🏨","全球豪华酒店业务。",90000000,1250000,90],
  ["南法私人酒庄","🍇","葡萄园、酒窖和精品酒店。",75000000,850000,75],
  ["环球商业银行","🏦","大型金融投资机构。",500000000,8500000,350]
 ],
 treasure:[
  ["海洋之心蓝钻","💎","稀世蓝钻。",48000000,0,110],
  ["大师传世名画","🖼️","私人艺术馆藏品。",68000000,0,145],
  ["皇家古董座钟","🕰️","古老宫廷的精密艺术品。",22000000,0,65],
  ["帝王翡翠摆件","🪷","顶级翡翠珍藏。",36000000,0,90]
 ]
};

/* =========================
   4. 股票市场
========================= */
const stockList=[
 {id:"XH",name:"星瀚科技",sector:"人工智能",price:185000,vol:.075,drift:.018,dividend:.002,quality:85},
 {id:"TL",name:"天龙能源",sector:"新能源",price:92000,vol:.045,drift:.012,dividend:.012,quality:75},
 {id:"HY",name:"环球金融",sector:"金融",price:126000,vol:.035,drift:.008,dividend:.018,quality:88},
 {id:"SW",name:"盛维医疗",sector:"生物医药",price:68000,vol:.095,drift:.016,dividend:.001,quality:68},
 {id:"JL",name:"金陵消费",sector:"高端消费",price:53000,vol:.04,drift:.01,dividend:.015,quality:82},
 {id:"HT",name:"华天半导体",sector:"芯片制造",price:245000,vol:.11,drift:.023,dividend:0,quality:78},
 {id:"YL",name:"远洋物流",sector:"航运物流",price:41000,vol:.085,drift:.006,dividend:.008,quality:62},
 {id:"DK",name:"帝科地产",sector:"房地产",price:76000,vol:.065,drift:-.004,dividend:.009,quality:48}
];

const sectorList=["人工智能","新能源","金融","生物医药","高端消费","芯片制造","航运物流","房地产"];

stockList.forEach(s=>{
 if(!g.stockQuotes[s.id]){
  g.stockQuotes[s.id]={price:s.price,change:0,history:[s.price]};
 }
});

function stockValue(){
 return stockList.reduce((sum,s)=>{
  let h=g.stockHoldings[s.id]||{shares:0};
  return sum+h.shares*g.stockQuotes[s.id].price;
 },0);
}

function stockCost(){
 return Object.values(g.stockHoldings).reduce((sum,h)=>sum+number(h.cost),0);
}

function stockProfit(){
 return stockValue()-stockCost();
}

function buyStock(id){
 let s=stockList.find(x=>x.id===id);
 let q=g.stockQuotes[id];
 let shares=askNumber(s.name+" 当前股价："+fmt(q.price)+"\n请输入购买股数：",1);
 if(shares===null||!Number.isInteger(shares)||shares<=0)return;

 let total=shares*q.price;
 let fee=total*.003;
 if(total+fee>g.cash)return alert("现金不足，无法完成交易。");

 g.cash-=total+fee;
 let h=g.stockHoldings[id]||{shares:0,cost:0};
 h.shares+=shares;
 h.cost+=total+fee;
 g.stockHoldings[id]=h;

 record("买入"+s.name+" "+shares+"股，成交金额"+fmt(total)+"，手续费"+fmt(fee));
 
 show("stocks");
}

function sellStock(id){
 let s=stockList.find(x=>x.id===id);
 let q=g.stockQuotes[id];
 let h=g.stockHoldings[id]||{shares:0,cost:0};
 if(h.shares<=0)return alert("你还没有持有这只股票。");

 let shares=askNumber(s.name+" 当前股价："+fmt(q.price)+"\n持有："+h.shares+"股\n请输入卖出股数：",h.shares);
 if(shares===null||!Number.isInteger(shares)||shares<=0||shares>h.shares)return;

 let avgCost=h.cost/h.shares;
 let gross=shares*q.price;
 let fee=gross*.003;
 let cost=avgCost*shares;
 let profit=gross-fee-cost;

 g.cash+=gross-fee;
 h.shares-=shares;
 h.cost=Math.max(0,h.cost-cost);

 if(h.shares===0)delete g.stockHoldings[id];

 record("卖出"+s.name+" "+shares+"股，"+(profit>=0?"盈利":"亏损")+fmt(Math.abs(profit)));
 
 show("stocks");
}

function stockInfo(id){
 let s=stockList.find(x=>x.id===id);
 let q=g.stockQuotes[id];
 let h=g.stockHoldings[id]||{shares:0,cost:0};
 let history=q.history.slice(-10).map((v,i)=>"第"+(i+1)+"期："+fmt(v)).join("\n");
 modal(s.name+" · "+s.id,
  "所属行业："+s.sector+
  "\n公司评级："+s.quality+"/100"+
  "\n当前股价："+fmt(q.price)+
  "\n今日涨跌："+pct(q.change)+
  "\n日波动率："+pct(s.vol)+
  "\n每日分红率："+pct(s.dividend)+
  "\n持有股数："+h.shares+
  "\n持仓成本："+fmt(h.cost)+
  "\n\n最近行情：\n"+history);

const marketRegimes={
 "牛市":{mood:.025,volatility:1.05,description:"资金持续流入，投资者信心强劲。"},

};

function changeMarketRegime(){
 let r=Math.random();
 if(r<.10)g.marketRegime="金融危机";
 else if(r<.35)g.marketRegime="熊市";
 else if(r<.67)g.marketRegime="牛市";
 else g.marketRegime="震荡市";

 g.marketDaysLeft=5+Math.floor(Math.random()*8);
 let info=marketRegimes[g.marketRegime];
 g.marketNews="市场进入"+g.marketRegime+"："+info.description;
 record(g.marketNews);
}

function marketClose(){
 g.marketDaysLeft--;
 if(g.marketDaysLeft<=0)changeMarketRegime();

 let regime=marketRegimes[g.marketRegime]||marketRegimes["震荡市"];

 if(Math.random()<.13){
  g.hotSector=sectorList[Math.floor(Math.random()*sectorList.length)];
  g.marketNews="行业风口："+g.hotSector+"板块出现资金关注。";
  record(g.marketNews);
 }

 let badSector=null;
 if(Math.random()<.07){
  badSector=sectorList[Math.floor(Math.random()*sectorList.length)];
  g.marketNews=badSector+"行业突发监管或经营风险消息。";
  record(g.marketNews);
 }

 stockList.forEach(s=>{
  let q=g.stockQuotes[s.id];
  let sectorBonus=s.sector===g.hotSector?.035:0;
  let sectorPenalty=s.sector===badSector?-.065:0;
  let qualityBonus=(s.quality-60)*.00025;
  let defensive=["HY","JL","TL"].includes(s.id);
  let mood=regime.mood;

  if(g.marketRegime==="熊市"&&defensive)mood*=.55;
  if(g.marketRegime==="金融危机"&&defensive)mood*=.72;

  let random=(Math.random()-.5)*2*s.vol*regime.volatility;
  let change=mood+s.drift+qualityBonus+sectorBonus+sectorPenalty+random;

  if(g.marketRegime==="金融危机"&&s.vol>.08)change-=.025;
  change=Math.max(-.30,Math.min(.30,change));

  q.price=Math.max(100,Math.round(q.price*(1+change)));
  q.change=change;
  q.history.push(q.price);
  if(q.history.length>30)q.history.shift();

  let h=g.stockHoldings[s.id];
  if(h&&h.shares>0&&s.dividend>0){
   let bonus=Math.floor(h.shares*q.price*s.dividend);
   g.cash+=bonus;
  }
 });

 if(Math.random()<.09){
  let events=[
   "央行释放流动性，市场信心有所恢复。",
   "国际资本大规模撤离，市场承压。",
   "大型科技企业发布突破性技术。",
   "全球供应链出现异常，制造业股票震荡。",
   "大型金融机构出现流动性问题。",
   "政策扶持计划公布，部分行业迎来机会。"
  ];
  let event=events[Math.floor(Math.random()*events.length)];
  g.marketNews=event;
  record("市场快讯："+event);
 }
}

  let payout=0;

  if(win){
   let multiplier=p.low+Math.random()*(p.high-p.low);
   payout=Math.floor(p.principal*multiplier);
   p.status="成功";
  }else{
   payout=Math.floor(p.principal*p.recovery*Math.random());
   p.status=payout>0?"失败·部分回收":"失败·血本无归";

  p.profit=payout-p.principal;
  g.cash+=payout;

function nextDay(){

 g.cash+=net;

 marketClose();
 settleInvestments();

 g.day++;
 g.women.forEach(w=>{

 });

 let events=[
  ["拍卖会邀请","你收到一份私人拍卖会邀请函。","treasure"],
  ["商业合作","一位投资人希望与你讨论合作。","business"],
  ["豪门宴会","你受邀参加一场高级私人宴会。","night"],
  ["平静的一天","今天一切顺利，产业持续经营。","estate"]
 ];

  "每日净现金变化："+fmt(net)+"。"+e[1];

 record("每日结算完成，净收入"+fmt(net)+"。"+e[1]);

 if(Math.random()<.12){
  let bonus=Math.floor(Math.random()*10000000)+1000000;
  g.cash+=bonus;
  record("随机商业机会带来额外收入"+fmt(bonus)+"。");

  g.cash-=loss;

 }

 
 show(current);
}
